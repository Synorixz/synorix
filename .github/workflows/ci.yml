# Synorix: lightweight CI (no MSVC / CL matrix). Replace with full ci when ready.
name: CI
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Basic checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository layout
        run: |
          test -f CMakeLists.txt
          test -f src/CMakeLists.txt
          test -f src/kernel/chainparams.cpp
          echo "Layout OK"
