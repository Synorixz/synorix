<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synorix Testnet</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <span class="logo">SNRX</span>
        <div>
          <h1>Synorix Testnet</h1>
          <p class="tagline">Node &middot; Wallet &middot; Mining</p>
        </div>
      </div>
      <div class="header-badges">
        <span id="remoteBadge" class="badge badge-info">Remote VPS</span>
        <span id="nodeBadge" class="badge badge-off">Offline</span>
      </div>
    </header>

    <section class="dashboard">
      <div class="stat-card" id="cardNode">
        <div class="stat-icon"><span class="status-dot" id="dotNode"></span></div>
        <div class="stat-body">
          <span class="stat-label">Node Status</span>
          <span class="stat-value" id="stNodeRun">Stopped</span>
        </div>
      </div>
      <div class="stat-card" id="cardBlocks">
        <div class="stat-icon"><span class="stat-emoji">&#9646;</span></div>
        <div class="stat-body">
          <span class="stat-label">Block Height</span>
          <span class="stat-value" id="stBlocks">&mdash;</span>
        </div>
      </div>
      <div class="stat-card" id="cardBalance">
        <div class="stat-icon"><span class="stat-emoji">&#9733;</span></div>
        <div class="stat-body">
          <span class="stat-label">Spendable</span>
          <span class="stat-value" id="stBal">&mdash;</span>
          <span class="stat-sub" id="stImmature"></span>
        </div>
      </div>
      <div class="stat-card" id="cardMining">
        <div class="stat-icon"><span class="status-dot" id="dotMine"></span></div>
        <div class="stat-body">
          <span class="stat-label">Mining</span>
          <span class="stat-value" id="stMining">Idle</span>
        </div>
      </div>
      <div class="stat-card" id="cardPeers">
        <div class="stat-icon"><span class="stat-emoji">&#8644;</span></div>
        <div class="stat-body">
          <span class="stat-label">Peers</span>
          <span class="stat-value" id="stPeers">&mdash;</span>
        </div>
      </div>
    </section>

    <section class="panel actions" id="panelActions">
      <div class="action-group">
        <h2>Node</h2>
        <div class="btn-row">
          <button type="button" class="primary" id="btnStartNode">Connect to Node</button>
          <button type="button" class="ghost" id="btnStopNode">Disconnect</button>
        </div>
        <p class="hint" id="stIbd">&mdash;</p>
      </div>

      <div class="action-group">
        <h2>Wallet</h2>
        <div class="wallet-selector">
          <label for="walletSelect">Active Wallet</label>
          <select id="walletSelect"><option value="">Loading...</option></select>
        </div>
        <div class="addr-box addr-main">
          <span class="addr-label">Your Address</span>
          <div class="copy-row">
            <code id="lastAddr" class="addr-highlight">&mdash;</code>
            <button type="button" class="copy-btn" id="btnCopyAddr" title="Copy address">&#128203;</button>
          </div>
        </div>
        <div class="btn-row">
          <button type="button" id="btnNewAddr">New Address</button>
          <button type="button" id="btnCreateWallet" hidden>Create Wallet</button>
        </div>
        <div class="input-row wallet-create-row">
          <label for="newWalletName">Create new wallet</label>
          <input type="text" id="newWalletName" placeholder="e.g. MyWallet" maxlength="30" />
          <button type="button" class="primary" id="btnCreateNamed">Create</button>
        </div>
        <code id="walletIdDisplay" hidden></code>
      </div>

      <div class="action-group">
        <h2>Mining</h2>
        <div class="input-row">
          <label for="mineN">Blocks</label>
          <input type="number" id="mineN" min="1" max="100" value="1" />
          <label for="mineAddr">Address</label>
          <input type="text" id="mineAddr" placeholder="Click 'New Address' or paste one" />
        </div>
        <div class="btn-row">
          <button type="button" class="accent" id="btnMine">Mine Once</button>
          <button type="button" class="primary" id="btnAutoMine"><span class="btn-text">Start Auto Mining</span><span class="spinner" hidden></span></button>
        </div>
      </div>

      <div class="action-group">
        <h2>Send Coins</h2>
        <div class="input-row">
          <label for="sendTo">Recipient</label>
          <input type="text" id="sendTo" placeholder="tsnrx1... address" />
          <label for="sendAmount">Amount (SNRX)</label>
          <input type="number" id="sendAmount" min="0.00000001" step="0.00000001" value="1" />
        </div>
        <div class="btn-row">
          <button type="button" class="accent" id="btnSend">Send</button>
        </div>
      </div>
    </section>

    <section class="panel log-panel">
      <h2>Activity Log</h2>
      <pre class="log" id="log"></pre>
    </section>

  </div>
  <div id="toastContainer"></div>
  <script src="renderer.js"></script>
</body>
</html>
